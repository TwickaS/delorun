# The dsh-doctor bundle patch: the doctor profile over dsh-base. It mounts the
# check registry, the shipped checks and the run-once app, which prints one
# line per check once startup commits and exits 0 when none failed. The app's
# `doctor` switch (Delorun's C16 switch, off by default) is on in this profile;
# another composition that mounts the app without it exits 1 without checks.

- insert:
    - id: doctor
      name: '@deepseek-ai/dsh-doctor'

    - id: doctor-checks
      name: '@deepseek-ai/dsh-doctor/checks'

    - id: doctor-app
      name: '@deepseek-ai/dsh-doctor/app'
      config:
        doctor: true

- id: hmr
  disabled: true
