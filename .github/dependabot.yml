version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 30
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 30
    groups:
      uv-dependencies:
        patterns:
          - "*"
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "kind/dependency"
      - "area/infra"
