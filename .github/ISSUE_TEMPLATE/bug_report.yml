name: Bug report
description: Report behaviour that does not work as documented.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report a vulnerability here. Report it privately as [SECURITY.md](https://github.com/Delo-Run/delo/blob/HEAD/SECURITY.md) describes.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `delorun --version`.
    validations:
      required: true
  - type: dropdown
    id: stock
    attributes:
      label: Does stock DeepSeek Harness reproduce it?
      options:
        - "Yes"
        - "No"
        - Not tried
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps, input or configuration that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The result you saw, and the result you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `delorun logs`. Delo redacts its logs, but read them before you post them and remove anything private.
      render: text
