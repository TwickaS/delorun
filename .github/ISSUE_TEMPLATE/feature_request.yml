name: Feature request
description: Propose new or changed behaviour.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Plugins are the preferred place for new behaviour. Describe the problem first; a plugin may already solve it, or may be the right way to build the idea.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, who is affected, and why it matters.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: The behaviour you propose, and any alternatives you considered.
    validations:
      required: true
