# The fork's git hooks, merged over upstream's lefthook.yml through a one-line
# uncommitted lefthook-local.yml (`extends: [delorun/lefthook.yml]`). GitHub
# Actions does not run on this repository, so the hooks are the checks a
# change gets: the commit runs the staged gates, the commit message is checked
# against the commit standard, and the push runs what changed since the remote
# branch's tip, or a new branch's merge base with v5, which already passed the
# gate. DELORUN_FULL_GATE=1 runs the whole gate. DELORUN_PUSH_SKIP names checks or
# groups the push leaves out, such as tests:snapshots.
pre-commit:
  jobs:
    # Overrides upstream's job of the same name: a staged record fails only for drift that HEAD did not have.
    - name: translation pairing (staged records)
      run: node_modules/.bin/tsx delorun/apps/tools/src/pairing-staged.ts {staged_files}

    - name: delorun checks (staged)
      run: node_modules/.bin/tsx delorun/apps/tools/src/run-checks.ts --pre-commit

pre-merge-commit:
  jobs:
    - name: translation pairing (staged records)
      run: node_modules/.bin/tsx delorun/apps/tools/src/pairing-staged.ts {staged_files}

pre-push:
  jobs:
    - name: typecheck
      skip: true
    - name: delorun checks
      run: node_modules/.bin/tsx delorun/apps/tools/src/run-checks.ts --pre-push --skip "${DELORUN_PUSH_SKIP:-}"
      use_stdin: true

commit-msg:
  jobs:
    - name: delorun commit standard
      run: node_modules/.bin/tsx delorun/apps/tools/src/check-commits.ts --message {1}
