# Delorun's parity overlay (contract C16). The replay lane passes this file to
# every snapshot process through DSH_SNAPSHOT_PATCH, after the root
# configuration and before every scenario layer. Record and refresh refuse it,
# and no shipped profile, bundle or person's configuration names it.
#
# A row here replaces the named entry's whole `config`, so the overlay sets a
# switch only on an entry that no layer before it configures. Those rows name
# the entry's module, which Cordis checks before it applies the row.
#
# The other built switches rest on their validated Config default, which is the
# parity value and which `parity-switches` checks against the registry:
#   preset_inspect          the row sits inside each Web preset's plugin list,
#                           which a patch cannot reach without replacing the
#                           whole preset row;
#   container_denial_marker the bundles and the root configurations set
#                           sandbox-policy's mode and workspace root, which a
#                           row here would erase;
#   doctor                  only the doctor profile mounts the app, and the
#                           replay starts no doctor process;
#   fetch_guard             the switch is off because its row of
#                           @delorun/bundle-local is restated disabled below, so
#                           no row of the root tree mounts the plugin; the
#                           parity composition leaves the fetchGuard service
#                           unmounted, and the provider reads its absence per
#                           hop and runs unguarded;
#   tool_failure_guard      the switch is off because its row of
#                           @delorun/bundle-local is restated disabled below, so
#                           no listener counts failed tool calls and no turn
#                           stops for them;
#   one_time_launch_tokens  the connection row carries the web bundle's
#                           trustedHosts expression, which a row here would
#                           erase; the bundle's patch of the row is left out,
#                           so upstream's reusable launch token signs in;
#   reach                   its row of @delorun/bundle-local is restated disabled
#                           below with home-auth's, so the parity composition
#                           registers no reach provider and opens no remote
#                           listener.
#
# The overlay also mounts @delorun/bundle-local, the bundle Delorun's CLI profiles
# add after upstream's web template: the last blocks restate that bundle's
# patch, each row in the parity form its LOCAL_ROWS entry gives
# (delorun/packages/bundle-local/src/rows.ts), and `parity-switches` fails when
# the two differ. The session-log upload row is left out: C16 gives it
# upstream's value, and this overlay follows each replay's root configuration,
# which turns upload off for the headless and ACP corpora and leaves it on
# elsewhere, so a row here would override it. The account row `deepseek-account`
# is left out too: C16 gives it upstream's value. Desktop analytics keeps Delorun's
# `false`. The Privacy section and the Delorun sidebar brand are present and
# disabled, because recorded web scenarios compare upstream's interface output
# and brand. The sandbox row is left out, so the replay runs upstream's
# confinement with no protected home. The plugin-manager row is left out, so
# plugin management protects only upstream's own components. The workspace-controller row is left out,
# so the replay places the first-use workspace by upstream's own documents
# lookup (C16 switch default_workspace_directory, a presence switch, off). The
# seven consent and guard rows (instruction consent, MCP consent, permission
# defaults, schedule consent, fetch guard, delegation consent and plugin
# changes), the update gate row, the update check row and the plugin install
# check row are present and disabled: stock makes no request for a newer
# release and audits no plugin, the shipped composition mounts each with its
# switches on, and a disabled row mounts nothing, which is each switch's parity
# value. The studio bundle and the permission defaults are planned, and the
# preset default keeps upstream's value (`standard`).

- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  config:
    readActionsExempt: false
    profileHistory: false

# @delorun/bundle-local, in its parity form.
- id: product-analytics
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION

- insert:
    - id: delorun-privacy
      name: '@delorun/bundle-local'
      disabled: true

- insert:
    - id: delorun-instruction-consent
      name: '@delorun/plugin-instruction-consent'
      config:
        enabled: true
        approvedPluginWrites: true
      disabled: true

    - id: delorun-mcp-consent
      name: '@delorun/plugin-mcp-consent'
      config:
        enabled: true
      disabled: true

    - id: delorun-permission-defaults
      name: '@delorun/plugin-permission-defaults'
      config:
        enabled: true
      disabled: true

    - id: delorun-schedule-consent
      name: '@delorun/plugin-schedule-consent'
      config:
        enabled: true
      disabled: true

    - id: delorun-fetch-guard
      name: '@delorun/plugin-fetch-guard'
      config:
        enabled: true
      disabled: true

    - id: delorun-tool-failure-guard
      name: '@delorun/plugin-tool-failure-guard'
      config:
        enabled: true
        consecutiveFailures: 6
        windowSize: 12
        windowFailures: 8
        reminderAfter: 3
        exclude: []
      disabled: true

    - id: delorun-plugin-authoring
      name: '@delorun/skill-plugin-authoring'
      disabled: true

    - id: delorun-report-problem
      name: '@delorun/skill-report-problem'
      disabled: true

    - id: delorun-delegation-consent
      name: '@delorun/plugin-delegation-consent'
      config:
        enabled: true
      disabled: true

    - id: delorun-external-agents
      name: '@delorun/external-agents'
      config:
        maxLivePrograms: 4
        graceMs: 3000
        probeMinIntervalMinutes: 30
        probeTriggers:
          - pack-added
          - signed-in
          - check-now
        limitRefusal: true
      disabled: true

    - id: delorun-agent-claude-code
      name: '@delorun/agent-claude-code'
      config:
        harnessToolTimeoutSeconds: 900
      disabled: true

    - id: delorun-agent-codex
      name: '@delorun/agent-codex'
      config:
        harnessToolTimeoutSeconds: 900
      disabled: true

    - id: delorun-agent-seats
      name: '@delorun/plugin-agent-seats'
      config:
        enabled: true
      disabled: true

    - id: delorun-multiview
      name: '@delorun/plugin-multiview'
      disabled: true

    - id: delorun-plugin-changes
      name: '@delorun/plugin-changes'
      config:
        enabled: true
        installationBundles:
          - '@deepseek-ai/dsh-base'
          - '@deepseek-ai/dsh-web-app'
          - '@delorun/bundle-local'
          - '@delorun/bundle-studio'
      disabled: true

    - id: delorun-plugin-update
      name: '@delorun/plugin-update'
      disabled: true

    - id: delorun-packs
      name: '@delorun/plugin-packs'
      config:
        concurrency: 2
      disabled: true

    - id: delorun-workspace-rename
      name: '@delorun/bundle-local/workspace-rename'
      config:
        enabled: true
      disabled: true

    - id: delorun-prompt-wording
      name: '@delorun/bundle-local/prompt-wording'
      config:
        enabled: true
      disabled: true

- insert:
    - id: delorun-update-gate
      name: '@delorun/bundle-local/update-gate'
      config:
        enabled: true
        holdUntilChecked: true
      disabled: true

- insert:
    - id: delorun-update-check
      name: '@delorun/bundle-local/update-check'
      config:
        enabled: true
        intervalHours: 24
        timeoutSeconds: 15
      disabled: true

- insert:
    - id: delorun-trust
      name: '@delorun/bundle-local/trust'
      config:
        enabled: true
      disabled: true

- insert:
    - id: delorun-profile-versions
      name: '@delorun/bundle-local/profile-versions'
      disabled: true

    - id: delorun-requirements
      name: '@delorun/bundle-local/requirements'
      disabled: true

    - id: delorun-report
      name: '@delorun/bundle-local/report'
      config:
        issueUrl: https://github.com/twickas/delorun/issues/new
        template: bug_report.yml
      disabled: true

    - id: delorun-run-settings
      name: '@delorun/bundle-local/run-settings'
      disabled: true

- insert:
    - id: delorun-plugin-install-check
      name: '@delorun/plugin-install-check'
      config:
        enabled: true
      disabled: true

- insert:
    - id: delorun-trash
      name: '@delorun/plugin-trash'
      config:
        trashRoot: !!js dshHomePath('trash')
        sessionsRoot: !!js dshHomePath('sessions')
        storagesRoot: !!js dshHomePath('storages')
        attachmentsRoot: !!js dshHomePath('attachments', 'v1')
        logsHome: !!js dshHomePath()
      disabled: true

- insert:
    - id: delorun-home-auth
      name: '@delorun/home-auth'
      config:
        secretsDirectory: !!js dshHomePath('secrets', 'home-auth')
      disabled: true

    - id: delorun-reach
      name: '@delorun/reach'
      config:
        enabled: true
        tailscalePrivate:
          enabled: false
          address: ''
          servePort: 443
      disabled: true
