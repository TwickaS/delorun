# C16 switch main_chat on. A Web scenario runs through an e2e driver under
# apps/web/tests, which mounts the main chat with enabled: true beside a
# workspaces provider; no shipped profile mounts the main chat.
version: 1
scenario: delorun-main-chat
profile: web
composition: web-default
recording: live
header:
  class: delorun-main-chat
  pin: true
input:
  task: List my workspaces and the chats in each.
