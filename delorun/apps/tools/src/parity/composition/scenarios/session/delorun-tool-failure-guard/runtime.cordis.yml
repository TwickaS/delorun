# C16 switch tool_failure_guard on: after 3 failed tool calls in a row the model
# reads one reminder, and after 6 in a row, or 8 of the last 12, the turn stops
# before its next model request.
- id: tool-failure-guard
  name: '@delorun/plugin-tool-failure-guard'
  config:
    enabled: true
    consecutiveFailures: 6
    windowSize: 12
    windowFailures: 8
    reminderAfter: 3
    exclude: []
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
