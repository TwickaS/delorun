# C16 switch scheduled_task_consent on: approving a schedule_create or
# schedule_edit ask names the recurrence it arms, the chat its deliveries
# reach and the permission preset that chat runs under, and a due delivery
# refuses — pausing the task — when the target chat no longer runs the preset
# the task was approved under. The row mounts the consent plugin with the
# switch on; the composition itself changes nothing else.
- id: delorun-schedule-consent
  name: '@delorun/plugin-schedule-consent'
  config:
    enabled: true
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
