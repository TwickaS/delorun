# C16 switch approved_plugin_write_consent on: the agent's first write in a
# chat to the folder of a plugin the person approved under Changes asks first,
# naming the plugin and carrying the diff, and a declined ask refuses the write
# with WriteConsentRefusedError. The instruction-layer consent stays off.
- id: instruction-consent
  name: '@delorun/plugin-instruction-consent'
  config:
    approvedPluginWrites: true
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
