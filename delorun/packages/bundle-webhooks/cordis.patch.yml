# The webhook runtime always mounts. The GitHub endpoint is a second web server on loopback only (port 3081 unless
# DELORUN_GITHUB_WEBHOOK_PORT says otherwise; a value that is not a port number stops the profile from loading) and starts off: Plugins says "Needs setup" until DELORUN_GITHUB_WEBHOOK_SECRET is set (the bundle's `delorun.requires`), so a turned-on
# bundle without a secret listens on nothing until the person also turns the endpoint on. The bundle ships no rule: without one a delivery creates no chat.
- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'
    - id: github-webhook-ingress
      name: cordis:group
      group: true
      disabled: true
      isolate:
        webServer: true
      config:
        # Upstream's web server under this bundle's module name: plugin management refuses a bundle that adds a row of
        # `@deepseek-ai/dsh-host-webserver`, the studio's own web server.
        - id: github-webhook-server
          name: '@delorun/bundle-webhooks/server'
          config:
            host: '127.0.0.1'
            port: !!js "(() => { const port = Number(process.env.DELORUN_GITHUB_WEBHOOK_PORT ?? 3081); if (!Number.isInteger(port) || port < 1 || port > 65535) throw new Error('DELORUN_GITHUB_WEBHOOK_PORT must be a whole number from 1 to 65535'); return port })()"
        - id: github-webhook-adapter
          name: '@deepseek-ai/dsh-webhook-github'
          config:
            source: github
            path: /github
            secretEnv: DELORUN_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
