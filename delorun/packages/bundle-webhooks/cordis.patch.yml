# The webhook runtime always mounts. The GitHub endpoint is a second web server on loopback only (port 3081 unless
# DELORUN_GITHUB_WEBHOOK_PORT says otherwise) and mounts only once DELORUN_GITHUB_WEBHOOK_SECRET is set, so a turned-on
# bundle without a secret listens on nothing. The bundle ships no rule: without one a delivery creates no chat.
- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'
    - id: github-webhook-ingress
      name: cordis:group
      group: true
      disabled: !!js "!process.env.DELORUN_GITHUB_WEBHOOK_SECRET"
      isolate:
        webServer: true
      config:
        - id: github-webhook-server
          name: '@deepseek-ai/dsh-host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js "Number(process.env.DELORUN_GITHUB_WEBHOOK_PORT ?? 3081)"
        - id: github-webhook-adapter
          name: '@deepseek-ai/dsh-webhook-github'
          config:
            source: github
            path: /github
            secretEnv: DELORUN_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
