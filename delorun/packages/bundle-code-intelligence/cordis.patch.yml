# The language-server provider and the model tool start off: the provider resolves every configured executable at load,
# so a missing one stops it from registering. Plugins says "Needs setup" while typescript-language-server is not on PATH
# (the bundle's `delorun.requires`). Add more servers in the profile's cordis.patch.yml by replacing the lsp-stdio row's config.
- insert:
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      disabled: true
      config:
        servers:
          typescript:
            command: typescript-language-server
            args:
              - --stdio
            extensionToLanguage:
              .ts: typescript
              .tsx: typescriptreact
              .js: javascript
              .jsx: javascriptreact
              .mjs: javascript
              .cjs: javascript
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
      disabled: true
