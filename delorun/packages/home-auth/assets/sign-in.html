<!doctype html>
<!--
  The reach sign-in page, served at /auth/sign-in by src/reach-routes.ts, which puts the content-hashed paths of the
  stylesheet and script in place of the two placeholders below. It holds markup only: every text comes from the copy
  table of sign-in.js, and it has no inline script, style or event handler. The Delorun mark in the header is the hex jack of @delorun/brand (src/mark.tsx), by value; the test keeps the two equal. The server replaces what lies between the brand comments, the title and the body's
  brand-name attribute when the person has their own branding (src/branding.ts).
  Every other icon is a glyph of the studio's product
  icon set (@deepseek-ai/dsh-client-ui-primitives), by value, at its 1.3 stroke.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="{{surface-light}}">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="{{surface-dark}}">
<title>Delorun</title>
{{icons}}
<link rel="stylesheet" href="{{style}}">
<script type="module" src="{{script}}"></script>
</head>
<body>
<div class="edge edge-top" aria-hidden="true"></div>
<div class="edge edge-bottom" aria-hidden="true"></div>

</svg>
<main data-sign-in>
<header class="brand"><span class="name"><!--brand-->{{mark}}<span class="wordmark">Delorun</span><!--/brand--></span><span class="address" id="address"></span></header>
<section class="card" id="card" aria-labelledby="title">
<div class="badge" id="badge" hidden><svg aria-hidden="true" focusable="false"><use id="badge-icon" href="#icon-loading"></use></svg></div>
<h1 id="title" tabindex="-1"></h1>
<p class="lead" id="lead"></p>
<ol class="steps" id="steps" hidden>
<li><span data-copy="request.step1"></span></li>
<li><span data-copy="request.step2"></span></li>
<li><span data-copy="request.step3"></span></li>
</ol>
<div class="code-panel" id="code-panel" hidden>
<p class="code" aria-hidden="true"><span id="code-first"></span><span id="code-second"></span></p>
<p class="visually-hidden" id="code-spoken"></p>
<p class="waiting"><span class="pulse" aria-hidden="true"></span><span data-copy="waiting.status"></span></p>
<p class="quiet" id="expiry"></p>
</div>
<p class="quiet" id="help" hidden></p>
<form id="request-form" novalidate hidden>
<div class="field">
<label for="label" data-copy="request.label"></label>
<input id="label" name="label" maxlength="64" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send" aria-describedby="label-hint">
<p class="quiet" id="label-hint" data-copy="request.hint"></p>
<p class="field-error" id="label-error" hidden></p>
</div>
<button class="primary" type="submit" id="submit"></button>
</form>
<p class="note" id="note" hidden></p>
<p class="quiet" id="detail" hidden></p>
<div class="actions" id="actions" hidden>
<button class="primary" type="button" id="retry"></button>
<button class="secondary" type="button" id="restart"></button>
</div>
</section>
<footer class="footer"><a href="https://docs.delorun.com/guide/everyday-use/reach" target="_blank" rel="noopener noreferrer"><span data-copy="guide"></span><span class="visually-hidden" data-copy="guide.newTab"></span><svg aria-hidden="true" focusable="false"><use href="#icon-external"></use></svg></a></footer>
<p class="visually-hidden" id="announce" role="status" aria-live="polite"></p>
</main>
<noscript><p>Signing in needs JavaScript. 登录需要启用 JavaScript。</p></noscript>
</body>
</html>
