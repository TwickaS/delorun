# The @delorun/bundle-studio patch: Delorun's studio additions in Delorun's CLI
# profiles, after @delorun/bundle-local (the order is DELORUN_PROFILE_BUNDLES in
# @delorun/bundle-local's src/profile.ts). The profile's own cordis.patch.yml
# comes after it, so the Settings switch back to the stock look, which writes
# the theme row's `studioAdditions`, wins over the value here.
#
# The theme row holds C16 switch `studio_additions`. Its Config default is
# off, the parity value; this row turns it on, and `parity-switches` holds the
# registry's default value to this row. While it is on, the theme provides the
# browser service `delorunStudio`; every other row here mounts a plugin whose
# browser half requires that service, so the stock look unloads them all and
# leaves upstream's studio. Their harness halves keep running: chat states
# stay stored while the stock look is on.
- insert:
    - id: delorun-theme
      name: '@delorun/plugin-theme'
      config:
        studioAdditions: true

    - id: delorun-settings-layout
      name: '@delorun/plugin-settings-layout'

    - id: delorun-chat-states
      name: '@delorun/plugin-chat-states'

    - id: delorun-sidebar
      name: '@delorun/plugin-sidebar'

    - id: delorun-onboarding
      name: '@delorun/plugin-onboarding'
      config:
        # The curated plugins the guide offers. Each package may say in its own
        # package.json which connections it is for ("delorun": { "connections": [...] });
        # the guide puts those that fit the person's connections first.
        plugins:
          - '@deepseek-ai/dsh-experimental-session-search'
          - '@deepseek-ai/dsh-experimental-terminal-bundle'
          - '@deepseek-ai/dsh-experimental-tool-worktree'
          - '@deepseek-ai/dsh-experimental-session-titles-bundle'
          # Upstream's DeepSeek website chat import: an optional bundle the plugin manager turns on (off until then), so it is
          # offered here by package, not as a row of this bundle.
          - '@deepseek-ai/dsh-deepseek-chat-import'
        # Rows of this bundle that are inserted disabled (below). The guide offers to turn each on through the plugin
        # manager; each must be a row of the profile, or onboarding does not load.
        optionalRows:
          - delorun-thinking-rsvp
          - delorun-cost-meter
        # The DeepSeek account has no sign-in in this release (@delorun/bundle-local disables `deepseek-account`), but its
        # model route `llm-deepseek-account` stays mounted, because an update refuses a row a release switches off that
        # the running release did not. The guide's provider list leaves the route out.
        hiddenProviders:
          - deepseek-account

# Upstream's first-run "Add an API key" dialog is off: the studio's no-key banner above the message box (in
# @delorun/plugin-onboarding) is the only nudge. A patch replaces the row's whole config, so this restates
# @delorun/bundle-local's `welcomeNotice: false`. The stock look keeps this row too, so upstream's dialog does not return
# there; Settings → Agent → Models and the model picker still add a key.
- id: ui-settings-models
  config:
    credentialOnboarding: false
    welcomeNotice: false

# The sidebar search looks inside chats, which needs upstream's content index. Upstream ships it closed (`openAt: never`,
# in memory), so every message search fails; this row opens it on the first search. The index stays in memory, as upstream's
# own session-search plugin has it: it is rebuilt from the chats' own session files, makes no network call, and leaves no
# copy of chat text in the home, so the trash purge and the update's data copy have nothing extra to cover.
# A patch replaces the row's whole config. The stock look keeps this row, and upstream's own search then also finds message text.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# Optional studio plugins: each row is inserted disabled, so a new profile
# mounts nothing of it until the person turns it on under Components on the Delorun studio page of the sidebar's Plugins,
# which writes `disabled: false` for the row in the profile's own patch. Like
# the rows above, the browser half requires `delorunStudio`.
- insert:
    - id: delorun-cost-meter
      name: '@delorun/plugin-cost-meter'
      disabled: true

    - id: delorun-thinking-rsvp
      name: '@delorun/plugin-thinking-rsvp'
      disabled: true
