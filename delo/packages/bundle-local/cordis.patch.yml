# The @delo/bundle-local patch: Delo's layer over upstream's web template in
# Delo's CLI profiles (src/profile.ts lists the order). Rows here target
# upstream rows by id, or insert Delo's local integration rows; the profile's
# own cordis.patch.yml and any --patch overlays still come after it, so the
# Privacy section's writes to the profile win over the values here.
#
# A patch replaces the targeted row's whole `config`, so a row here restates
# every key it keeps. Each row is listed in LOCAL_ROWS (src/profile.ts), and
# the package's composition spec fails on a row that is not.

# DeepSeek's session-log upload is off until the person turns it on (C11).
# The base bundle's row has no config, so `enabled` is the only key.
- id: session-log-deepseek
  config:
    enabled: false

# Searching the machine must not reach Delo's own home: the search tools' protected-read fence is on, so `glob` and
# `grep` refuse a path under it as the file tools already do (C16 switch sandbox_protected_reads). A patch replaces
# the targeted row's whole `config`, so the bundles' over-cap sampling choice is restated.
- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    protectedReads: true

# DeepSeek's account and Platform sign-in (browser PKCE to platform.deepseek.com, account details, Usage and Top-up pages)
# is removed from Delo's CLI profiles: the first release has no DeepSeek account service. The row stays in upstream's
# composition for parity, and llm-deepseek-account, which needs a signed-in account, stays inert without it. The
# DeepSeek API-key provider is unaffected.
- id: deepseek-account
  disabled: true

# Feedback goes nowhere outside the machine. Upstream's feedback telemetry exporter sends a session-log prefix to
# DeepSeek's collector when the person sends feedback, and Delo has no DeepSeek feedback service, so the row is disabled.
- id: session-telemetry-otel
  disabled: true

# The search tools' protected-read fence, on: with the sandbox row Delo's start configures, `glob` and `grep` refuse a
# search rooted under the Delo home and leave its paths out of a wider search, as `read` and `read_image` already do.
# Upstream ships the fence off, so a bare profile keeps searching the whole machine and prints what it finds there. A
# patch replaces the targeted row's whole `config`, so this row restates upstream's over-cap sampling choice.
- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    protectedReads: true

# The /feedback command and the message feedback surface (Like, Dislike and the dialog) send through that exporter.
# Upstream offers no row that opens an external page, so Delo's composition hides both instead.
- id: command-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

# The account menu, the sign-in dialog and the account section need DeepSeek's account service, which Delo's
# composition removes; without this row the More menu shows no Sign in entry.
- id: ui-settings-account
  disabled: true

# Upstream's Web preview notice names DeepSeek Harness; Delo shows its own notice from @delo/bundle-local instead.
# The row keeps upstream's other onboarding settings.
- id: ui-settings-models
  config:
    credentialOnboarding: true
    welcomeNotice: false

# C1's home protection on upstream's sandbox provider. The row is mounted bare
# by the base bundle, and `protectedHome` defaults to unset there, so a confined
# command reads the whole harness home — the consent stores under `secrets/`
# included. `dshHomePath` is the harness home, which C1 sets to the Delo home
# for every runtime process; the readable entries are C1's read exemptions,
# which hold no secret. `delorun start` keeps adding that profile's channel
# sockets as `deniedSockets` in `run/<profile>/sandbox.patch.yml`.
- id: sandbox
  config:
    protectedHome: !!js dshHomePath()
    protectedHomeReadable:
      - runtimes
      - skills
      - dsh-runtimes

# Desktop analytics is off until the person turns it on (C11). The row keeps
# the web bundle's `disabled` condition, so it mounts only in the desktop
# profile; `appVersion` restates the web bundle's value.
- id: product-analytics
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION

# The Privacy section in Settings: the statements and the consent switches
# for the two rows above.
- insert:
    - id: delo-privacy
      name: '@delo/bundle-local'

# Delo's consent and guard plugins, each mounted with the C16 switch its Config
# declares on (the plugin's default is the parity value, off). This bundle is
# the only Delo layer a CLI profile adds, so without these rows no shipped
# composition mounts any of them: a model-authored write to an instruction
# layer, an added stdio MCP server, a full-access mode switch, a scheduled
# delivery into a moved workspace and a fetch of a private address each ran
# unguarded. The rows come after upstream's, and before the profile's own patch
# and every row a person adds, so an MCP server a person configures boots after
# the consent service is registered. `permission_defaults` alone provides the
# sandbox-mode guard (A135): `instruction-consent` takes no part of that slot.
- insert:
    - id: delo-instruction-consent
      name: '@delo/plugin-instruction-consent'
      config:
        enabled: true

    - id: delo-mcp-consent
      name: '@delo/plugin-mcp-consent'
      config:
        enabled: true

    - id: delo-permission-defaults
      name: '@delo/plugin-permission-defaults'
      config:
        enabled: true

    - id: delo-schedule-consent
      name: '@delo/plugin-schedule-consent'
      config:
        enabled: true

    - id: delo-fetch-guard
      name: '@delo/plugin-fetch-guard'
      config:
        enabled: true
