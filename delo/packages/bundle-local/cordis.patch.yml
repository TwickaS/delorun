# The @delo/bundle-local patch: Delo's layer over upstream's web template in
# Delo's CLI profiles (src/profile.ts lists the order). Rows here target
# upstream rows by id, or insert Delo's local integration rows; the profile's
# own cordis.patch.yml and any --patch overlays still come after it, so the
# Privacy section's writes to the profile win over the values here.
#
# A patch replaces the targeted row's whole `config`, so a row here restates
# every key it keeps. Each row is listed in LOCAL_ROWS (src/profile.ts), and
# the package's composition spec fails on a row that is not.

# DeepSeek's session-log upload is off until the person turns it on (C11).
# The base bundle's row has no config, so `enabled` is the only key.
- id: session-log-deepseek
  config:
    enabled: false

# DeepSeek's account and Platform sign-in (browser PKCE to platform.deepseek.com, account details, Usage and Top-up pages)
# is removed from Delo's CLI profiles: the first release has no DeepSeek account service. The row stays in upstream's
# composition for parity, and llm-deepseek-account, which needs a signed-in account, stays inert without it. The
# DeepSeek API-key provider is unaffected.
- id: deepseek-account
  disabled: true

# The API controller over that account service: it requires `deepseekAccount`, which no enabled row provides once the row
# above is disabled, so left mounted it waits for the service for good and the Host starts with a did-not-activate warning.
- id: account-controller
  disabled: true

# Feedback goes nowhere outside the machine. Upstream's feedback telemetry exporter sends a session-log prefix to
# DeepSeek's collector when the person sends feedback, and Delo has no DeepSeek feedback service, so the row is disabled.
- id: session-telemetry-otel
  disabled: true

# The /feedback command and the message feedback surface (Like, Dislike and the dialog) send through that exporter.
# Upstream offers no row that opens an external page, so Delo's composition hides both instead.
- id: command-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

# The account menu, the sign-in dialog and the account section need DeepSeek's account service, which Delo's
# composition removes; without this row the More menu shows no Sign in entry.
- id: ui-settings-account
  disabled: true

# Upstream's Web preview notice names DeepSeek Harness; Delo shows its own notice from @delo/bundle-local instead.
# The row keeps upstream's other onboarding settings.
- id: ui-settings-models
  config:
    credentialOnboarding: true
    welcomeNotice: false

# Studio sign-in links work once (C4, C16 switch `one_time_launch_tokens`): no
# reusable launch token exists, each link `delorun open` or a start asks for
# expires after 60 seconds and its first use consumes it, and a refused
# request tells the person to run `delorun open`, or `--port` for a link
# through a forwarded port. The row restates the web
# bundle's trustedHosts expression and keeps its `inject: [webStartup]`.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
    oneTimeLaunchTokens: true
    reopenHint: run delorun open to open the studio, or delorun open --print --port <port> for a link through a forwarded port

# C1's home protection on upstream's sandbox provider. The row is mounted bare
# by the base bundle, and `protectedHome` defaults to unset there, so a confined
# command reads the whole harness home — the consent stores under `secrets/`
# included. `dshHomePath` is the harness home, which C1 sets to the Delo home
# for every runtime process; the readable entries are C1's read exemptions,
# which hold no secret. The provider's protected home is also what every tool
# row refuses to read or search, the rows inside each agent preset included:
# `read`, `read_image`, `apply_patch`, `glob` and `grep` take it from this row
# and from no setting of their own. They may read the tool-readable `spill/`,
# which confined commands cannot. `delorun start` keeps adding that profile's
# channel sockets as `deniedSockets` in `run/<profile>/sandbox.patch.yml`.
- id: sandbox
  config:
    protectedHome: !!js dshHomePath()
    protectedHomeReadable:
      - runtimes
      - skills
      - dsh-runtimes
    # Spilled tool output, which the spill notice tells the model to read.
    protectedHomeToolReadable:
      - spill

# The studio's first-use workspace folder. `delorun start` resolves it before the
# profile boots (`<documents>/Delo/default-workspace`, or `<home>/Delo/default-workspace`
# where the platform reports no documents folder) and sets DELO_DEFAULT_WORKSPACE
# (DEFAULT_WORKSPACE_ENV in src/profile.ts) in the Host's own process. A boot by
# anything other than `delorun start` leaves the variable unset, so the key is
# unset and upstream's own documents lookup applies. A person chooses another
# folder by restating this row in the profile's own cordis.patch.yml, whose
# `config` replaces this one. Upstream's web bundle mounts the row with no config.
- id: workspace-controller
  name: '@deepseek-ai/dsh-api-workspace-controller'
  config:
    defaultWorkspaceDirectory: !!js process.env.DELO_DEFAULT_WORKSPACE

# Desktop analytics is off until the person turns it on (C11). The row keeps
# the web bundle's `disabled` condition, so it mounts only in the desktop
# profile; `appVersion` restates the web bundle's value.
- id: product-analytics
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION

# The Privacy section in Settings: the statements and the consent switches
# for the two rows above.
- insert:
    - id: delo-privacy
      name: '@delo/bundle-local'

# Delo's consent and guard plugins, each mounted with the C16 switches its
# Config declares on (the plugin's default is the parity value, off). This
# bundle is the only Delo layer a CLI profile adds, so without these rows no
# shipped composition mounts any of them: a model-authored write to an
# instruction layer or to an approved plugin's folder, an added stdio MCP
# server, a full-access mode switch, a scheduled delivery into a moved
# workspace, a fetch of a private address and an agent's plugin install or
# removal each ran unguarded. The Loader starts rows concurrently, so row order
# does not order their startup: an mcp-client row waits for the
# `delo-mcp-consent` row, which declares itself the `mcpAddConsent` provider,
# before it starts a stdio server. `permission_defaults` alone provides the
# sandbox-mode guard (A135): `instruction-consent` takes no part of that slot.
- insert:
    - id: delo-instruction-consent
      name: '@delo/plugin-instruction-consent'
      config:
        enabled: true
        approvedPluginWrites: true

    - id: delo-mcp-consent
      name: '@delo/plugin-mcp-consent'
      config:
        enabled: true

    - id: delo-permission-defaults
      name: '@delo/plugin-permission-defaults'
      config:
        enabled: true

    - id: delo-schedule-consent
      name: '@delo/plugin-schedule-consent'
      config:
        enabled: true

    - id: delo-fetch-guard
      name: '@delo/plugin-fetch-guard'
      config:
        enabled: true

    - id: delo-plugin-changes
      name: '@delo/plugin-changes'
      config:
        enabled: true
        # Safe mode from the studio's recovery screen keeps these bundles, Delo's profile bundle list
        # (DELO_PROFILE_BUNDLES in src/profile.ts; tests/plugin-changes-row.spec.ts holds the two equal).
        installationBundles:
          - '@deepseek-ai/dsh-base'
          - '@deepseek-ai/dsh-web-app'
          - '@delo/bundle-local'
          - '@delo/bundle-studio'

# The update gate (C16 switch `update_turn_refusal`): while `delorun update` or
# a stop waits for running chats (C19's `waiting` phase), the first step of
# every new turn is refused with UPDATE_PENDING, so the wait ends once the
# running turns end. `delorun` attaches its chat gate to the deloTurnGate
# service this row provides; without the row, a turn that starts during the
# wait is counted and the wait lasts until it ends. `holdUntilChecked` makes
# the first step of every turn wait until `delorun` has checked the booted
# Host's rows and services (C19), so no turn starts before that check; a turn
# that waits longer than `checkWaitSeconds` (60 by default) ends with
# START_CHECK_PENDING, which says to start Delo with `delorun start`.
- insert:
    - id: delo-update-gate
      name: '@delo/bundle-local/update-gate'
      config:
        enabled: true
        holdUntilChecked: true

# The update check (C16 switch `update_check`): when the last check is an
# interval old, at start or at an hourly wake while the Host runs, the
# channel's newest release is fetched and verified as an update verifies it,
# and the studio's sidebar shows a notice when it is newer. `delorun`
# attaches the check to the deloUpdateCheck service this row provides;
# Settings → Privacy turns `enabled` off in the profile's own patch, which
# comes after this one. The other two keys keep the plugin's defaults.
- insert:
    - id: delo-update-check
      name: '@delo/bundle-local/update-check'
      config:
        enabled: true
        intervalHours: 24
        timeoutSeconds: 15

# Plugin management protects the guard rows and the update check above, remote
# access and the home's sign-in (so no chat turns remote access on or points
# its records elsewhere), and the sandbox rows, as it protects its own
# components: the `plugin_manager` tool, which runs without a prompt in full
# access, cannot disable a protected row, change its settings, or deselect or
# remove a bundle that carries one, this bundle included, so no chat in one
# workspace turns a guard off, or silences the update check, for every
# workspace; with the plugin changes row off, the agent's plugin installs and
# removals would run instead of waiting for review. Settings → Privacy writes
# the update check's switch through the settings service, which this list does
# not govern. Upstream's base
# bundle gives the row no config, so `protectedPlugins` is the only key.
- id: plugin-manager
  config:
    protectedPlugins:
      - '@delo/plugin-instruction-consent'
      - '@delo/plugin-mcp-consent'
      - '@delo/plugin-permission-defaults'
      - '@delo/plugin-schedule-consent'
      - '@delo/plugin-fetch-guard'
      - '@delo/plugin-changes'
      - '@delo/bundle-local/update-gate'
      - '@delo/bundle-local/update-check'
      - '@delo/reach'
      - '@delo/home-auth'
      - '@deepseek-ai/dsh-sandbox-local'
      - '@deepseek-ai/dsh-sandbox-policy'

# Contract C8's trash: deleting a chat or a workspace in the studio moves it to
# the trash under the home, the Trash section in Settings restores it or
# deletes it forever, and each start deletes what is older than 30 days. The
# paths are the home's own stores, which the purge reaches.
- insert:
    - id: delo-trash
      name: '@delo/plugin-trash'
      config:
        trashRoot: !!js dshHomePath('trash')
        sessionsRoot: !!js dshHomePath('sessions')
        storagesRoot: !!js dshHomePath('storages')
        attachmentsRoot: !!js dshHomePath('attachments', 'v1')
        logsHome: !!js dshHomePath()

# Remote access over the person's own tailnet (C4, C5, C7, C14). home-auth
# provides upstream's authenticator: on the loopback listener it keeps
# upstream's admission, and it serves the device routes and the reach sign-in.
# The reach service mounts behind the C16 switch `reach`; each option in it
# stays off until the person runs `delorun reach on tailscale`, which writes
# this row's `tailscalePrivate` in the profile's own patch.
- insert:
    - id: delo-home-auth
      name: '@delo/home-auth'
      config:
        secretsDirectory: !!js dshHomePath('secrets', 'home-auth')

    - id: delo-reach
      name: '@delo/reach'
      config:
        enabled: true
        tailscalePrivate:
          enabled: false
          address: ''
          servePort: 443
