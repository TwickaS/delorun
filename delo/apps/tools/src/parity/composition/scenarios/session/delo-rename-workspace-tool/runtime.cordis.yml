# C16 switch rename_workspace_tool on: the model has a rename_workspace tool, which asks the person before it renames a
# workspace.
- id: delo-workspaces
  name: '@delo/plugin-workspaces'
  config:
    root: /tmp/delo-parity-workspaces
    renameWorkspaceTool: true
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
