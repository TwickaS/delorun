# C16 switch permission_defaults on: a new chat starts on the preset its workspace
# recorded, the safer workspace-write while the workspace has none, and a switch
# to danger-full-access is refused until the workspace holds the person's one
# consent for it.
- id: permission-defaults
  name: '@delo/plugin-permission-defaults'
  config:
    enabled: true
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
