# C16 switch instruction_layer_consent on: the mounted writeConsent service asks
# before a model-authored write to a skill, a preset or an AGENTS.md commits,
# with the effect and the diff in the ask, and the mounted sandboxModeGuard
# refuses no sandbox/mode change.
- id: instruction-consent
  name: '@delo/plugin-instruction-consent'
  config:
    enabled: true
# Pins the corpus model. model.cordis.yml pins the model only when a primary Session
# exists, so a first record needs this row.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
